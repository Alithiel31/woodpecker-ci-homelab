name: Lint Markdown

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/lint-markdown.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/lint-markdown.yml"]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
